[project]
name = "shorts-api"
version = "0.1.0"
description = "Local FastAPI service: Ollama + mflux + Piper + ffmpeg pipeline for etymology Shorts"
requires-python = ">=3.12"

dependencies = [
    # Web service
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",

    # External calls / async — pinned <1.0 because the 1.x dev line moved AsyncClient
    "httpx>=0.28,<1.0",

    # Image generation (Apple Silicon native, MLX-backed Flux)
    "mflux>=0.5.1",

    # Text-to-speech (local, ONNX-backed)
    "piper-tts>=1.2.0",

    # Number-to-words (Piper reads "1688" as "one thousand six hundred…";
    # we normalize years to "sixteen eighty-eight" before TTS).
    "num2words>=0.5.13",

    # YouTube upload
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
]

[tool.uv]
# Not installing this directory as a package — it's a runnable service
package = false
# Allow prereleases; mflux moves fast on Apple Silicon
prerelease = "allow"
